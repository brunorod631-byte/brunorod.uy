    /* Las rutas son absolutas: GitHub Pages sirve este archivo en cualquier URL que no exista */
    .error {

      display: flex; flex-direction: column; align-items: center; justify-content: center;

    .error-codigo {

      font-size: clamp(96px, 26vw, 190px); margin-bottom: 32px;
    }
    /* El 0 es una cámara domo vista de frente que vigila de lado a lado */
    .error-domo {
      position: relative; width: 0.82em; height: 0.82em; border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #33334a, var(--panel) 62%);
      border: 1px solid var(--borde);
      box-shadow: inset 0 0 0 6px var(--fondo), 0 0 40px rgba(82, 102, 235, 0.28);
      overflow: hidden;
    }
    .error-lente {
      position: absolute; left: 50%; top: 50%; width: 42%; height: 42%; margin: -21% 0 0 -21%;
      border-radius: 50%; background: radial-gradient(circle at 38% 34%, #8f9bff 0 8%, var(--acento) 26%, #10101a 68%);
      box-shadow: 0 0 0 4px var(--fondo-2), 0 0 18px rgba(82, 102, 235, 0.7);
      animation: error-vigila 7s ease-in-out infinite;
    }
    @keyframes error-vigila {
      0%, 100% { transform: translate(-48%, 4%); }
      45%, 55% { transform: translate(48%, 4%); }
      22% { transform: translate(0, 20%); }
      78% { transform: translate(0, -14%); }
    }
    .error-luz {
      position: absolute; left: 50%; top: 14%; width: 7px; height: 7px; margin-left: -3px;
      border-radius: 50%; background: #ff4d4f; box-shadow: 0 0 8px #ff4d4f;
      animation: error-luz 1.6s steps(2, jump-none) infinite;
    }
    @keyframes error-luz { to { opacity: 0.2; } }
    .error h1 { font-size: clamp(26px, 5vw, 40px); margin-bottom: 12px; }
    .error-texto { color: var(--suave); max-width: 460px; margin-bottom: 28px; }
    .error-acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
